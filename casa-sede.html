<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>casa-sede</title>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
html, body {
margin:0;
width:100%;
height:100%;
background:#202020;
font-family:Arial;
color:white;
text-align:center;
}

h1 {
padding:10px;
}

model-viewer {
width:100%;
height:70vh;
}

.pdf-button {
position: fixed;
bottom: 20px;
left: 0;
width: 100%;
text-align: center;
z-index: 10;
}

.pdf-button a {
display:inline-block;
padding:8px 16px;
background:#2ecc71;
color:white;
text-decoration:none;
border-radius:6px;
font-size:14px;
}

</style>

</head>

<body>

<h1>Casa Sede</h1>



<model-viewer
src="casa-sede.glb"
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>





</body>

</html>
